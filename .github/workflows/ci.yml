name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    # nb.csproj alone, never the solution: nb's own publish targets build the provider
    # plugins and collect them into providers/<name>, and a solution-level publish built
    # the same projects concurrently on other nodes and raced them over one output
    # directory (MSB3030, a different provider each run). See the comment in nb.csproj.
    - name: Publish artifacts
      run: |
        for rid in win-x64 linux-x64 osx-x64; do
          dotnet publish nb.csproj -c Release -r $rid --self-contained -o ./artifacts/$rid
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nb-builds
        path: ./artifacts/
