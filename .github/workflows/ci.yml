name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    # Per project, not per solution: a solution-level --output with --self-contained
    # published every provider with its own copy of the runtime, and the providers'
    # post-build copy raced the publish pipeline over those files (MSB3030, a different
    # provider each run). nb is the only project that needs a runtime bundled; providers
    # load into its process and publish framework-dependent into the layout nb loads from.
    - name: Publish artifacts
      run: |
        for rid in win-x64 linux-x64 osx-x64; do
          dotnet publish nb.csproj -c Release -r $rid --self-contained -o ./artifacts/$rid
          for p in Providers/*/nb.Providers.*Provider.csproj; do
            name=$(basename "$(dirname "$p")" | tr 'A-Z' 'a-z')
            dotnet publish "$p" -c Release -o "./artifacts/$rid/providers/$name"
          done
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nb-builds
        path: ./artifacts/
